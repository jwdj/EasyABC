     viewBox="0 0 256 256">

  <defs>

    <linearGradient id="paper"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#fafffb"/>
      <stop offset="100%" stop-color="#dff5e3"/>
    </linearGradient>

    <linearGradient id="fold"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <!--<stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8eadb"/>-->
      <stop offset="0%" stop-color="#d8eadb"/>
      <stop offset="100%" stop-color="#0A6C40"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="2"
                    dy="3"
                    stdDeviation="3"
                    flood-opacity="0.25"/>
    </filter>

  </defs>

  <!-- Document -->

  <g filter="url(#shadow)">

    <path d="
      M32 16
